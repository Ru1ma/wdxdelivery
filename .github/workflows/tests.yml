name: Baseline and assignment checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python examples/make_synthetic.py
      - run: python -m wdxdelivery examples/synthetic.json --json outputs/baseline.json --markdown outputs/baseline.md
      - run: cmp outputs/baseline.json evidence/synthetic-baseline-v2.json
      - run: cmp outputs/baseline.md evidence/synthetic-baseline-v2.md
      - run: python -m wdxdelivery.planner examples/correction-input.json --plan outputs/automatic-plan.json --json outputs/automatic-report.json --markdown outputs/automatic-report.md
      - run: cmp outputs/automatic-report.json evidence/automatic-correction.json
      - run: cmp outputs/automatic-report.md evidence/automatic-correction.md
      - run: python -m examples.generate_evidence --check
